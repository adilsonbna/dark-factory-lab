[package]
name = "checkout"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
# rustls-tls = pure-Rust TLS, zero system OpenSSL dependency — required for
# static musl builds on Alpine where only dynamic libssl.so is available.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
opentelemetry = { version = "0.26", features = ["trace"] }
opentelemetry_sdk = { version = "0.26", features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.26", features = ["grpc-tonic", "trace"] }
